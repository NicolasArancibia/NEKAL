<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>TabBar — vista previa</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{padding:var(--space-lg);background:var(--background);color:var(--ink);font:500 14px/20px var(--font-sans)}
.row{display:flex;gap:var(--space-md);flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:var(--space-md)}
.cap{font:500 12px/16px var(--font-sans);color:var(--ink-secondary)}
.sec{font:700 12px/16px var(--font-sans);color:var(--ink-secondary);margin:0 0 var(--space-sm)}

.bar{display:flex;justify-content:space-around;align-items:center;height:var(--tab-bar);background:var(--surface);border-top:1px solid var(--line);border-radius:var(--radius-md) var(--radius-md) 0 0;max-width:380px}
.t{color:var(--ink-secondary);display:flex}.t.on{color:var(--primary)}

</style></head>
<body>
<div class="bar"><span class="t on" aria-label="Resumen"><svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="t" aria-label="Calendario"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span class="t" aria-label="Espacio"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l8 1M7 8l4 8M17 10l-4 6"/></svg></span><span class="t" aria-label="Chat"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span class="t" aria-label="Perfil"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span></div><p class="cap" style="margin-top:var(--space-sm)">Íconos de ejemplo; en la app son Ionicons de línea.</p>
</body></html>
